[workspace]
resolver = "2"
members = ["crates/core", "crates/ssh", "crates/sync", "apps/rina/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
rina-core = { path = "crates/core" }
rina-ssh = { path = "crates/ssh" }
rina-sync = { path = "crates/sync" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
