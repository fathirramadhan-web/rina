[package]
name = "rina-ssh"
version.workspace = true
edition.workspace = true

[dependencies]
rina-core = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "4"
tracing = { workspace = true }
zeroize = { workspace = true }
async-trait = "0.1"
serde = { workspace = true }

[dev-dependencies]
# For `PrivateKey::random` (ssh-key uses rand_core 0.10).
rand = { version = "0.10", features = ["thread_rng"] }
# Enable async-trait on the SFTP server Handler trait.
russh-sftp = { version = "4", features = ["async-trait"] }
async-trait = "0.1"
tokio = { workspace = true }
